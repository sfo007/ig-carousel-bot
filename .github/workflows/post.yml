name: Post Instagram carousel

on:
  schedule:
    # Tuesday and Friday at 12:30 UTC = 6:00 PM IST
    - cron: "30 12 * * 2,5"
    # Main trigger is cron-job.org (workflow_dispatch, dry_run=false) at 12:30 UTC.
    # These GitHub schedules are only backups.
    # Backup attempts: GitHub sometimes drops or delays scheduled runs.
    # The script skips these if the post already went out today.
    - cron: "30 14 * * 2,5"
    - cron: "30 16 * * 2,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate slides but do not post to Instagram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ig-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Check topics for duplicates
        continue-on-error: true
        run: node check-topics.js

      - name: Generate slides
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node generate.js

      - name: Commit slides (so Instagram can fetch the images)
        if: steps.gen.outputs.skip != 'true'
        run: |
          git config user.name "carousel-bot"
          git config user.email "carousel-bot@users.noreply.github.com"
          git add posts
          git commit -m "Add carousel slides" || echo "nothing to commit"
          git push

      - name: Publish to Instagram
        if: steps.gen.outputs.skip != 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node publish.js

      - name: Mark topic as posted
        if: steps.gen.outputs.skip != 'true'
        run: |
          git add topics.json
          git commit -m "Mark topic as posted" || echo "nothing to commit"
          git push
