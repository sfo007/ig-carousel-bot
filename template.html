<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  {{FONTS}}
  :root { --bg:{{BG}}; --card:{{CARD}}; --line:{{LINE}}; --accent:{{ACCENT}}; --text:{{TEXT}}; --muted:{{MUTED}}; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1080px; height:1350px; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; overflow:hidden; position:relative; }
  .grid { position:absolute; inset:0; opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:90px 90px;
    -webkit-mask-image:radial-gradient(ellipse at 75% 15%,#000 0%,transparent 65%);
            mask-image:radial-gradient(ellipse at 75% 15%,#000 0%,transparent 65%); }
  .wrap { position:absolute; inset:0; padding:80px; display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .brand { display:flex; align-items:center; gap:22px; }
  .logo { width:76px; height:76px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:800; font-size:28px; letter-spacing:-1px; }
  .name, .count, .swipe, .label, .site { font-family:'JetBrains Mono',monospace; text-transform:uppercase; }
  .name { font-size:24px; letter-spacing:5px; color:var(--muted); }
  .count { font-size:26px; letter-spacing:3px; color:var(--muted); }
  .main { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .label { font-size:28px; letter-spacing:5px; color:var(--accent); margin-bottom:44px; }
  h1 { font-family:'Syne',sans-serif; font-weight:800; line-height:1.04; letter-spacing:-2px; color:var(--text); }
  h1 .dot { color:var(--accent); }
  p { color:var(--muted); line-height:1.45; }
  .cover h1 { font-size:92px; letter-spacing:-3px; }
  .cover p { font-size:42px; margin-top:40px; }
  .content h1 { font-size:68px; }
  .content p { margin-top:40px; background:var(--card); border:1px solid var(--line); border-radius:36px; padding:40px 44px; font-size:36px; color:var(--text); opacity:.92; }
  .cta h1 { font-size:88px; letter-spacing:-3px; }
  .cta p { font-size:42px; margin-top:44px; }
  .vis { margin-top:36px; }
  .win { background:var(--card); border:1px solid var(--line); border-radius:32px; overflow:hidden; }
  .win-h { display:flex; align-items:center; gap:12px; padding:20px 28px; border-bottom:1px solid var(--line); }
  .win-h i { width:14px; height:14px; border-radius:50%; background:#2c2c31; }
  .win-h span { font-family:'JetBrains Mono',monospace; font-size:22px; color:var(--muted); margin-left:10px; }
  .win-b { padding:24px 28px; font-family:'JetBrains Mono',monospace; font-size:25px; line-height:1.7; color:var(--text); }
  .ln { display:flex; gap:24px; white-space:pre; }
  .ln b { color:#55555c; font-weight:400; width:32px; flex:none; }
  .acc { color:var(--accent); }
  .tag { color:#bdb9ae; }
  .chk { display:flex; flex-direction:column; gap:14px; }
  .chk > div { display:flex; align-items:center; gap:22px; background:var(--card); border:1px solid var(--line); border-radius:26px; padding:20px 28px; font-size:32px; }
  .tick { width:40px; height:40px; border-radius:50%; background:var(--accent); color:var(--bg); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; flex:none; }
  .flow { display:flex; align-items:center; flex-wrap:wrap; gap:14px; }
  .step { padding:18px 28px; border:1px solid var(--line); background:var(--card); border-radius:100px; font-family:'JetBrains Mono',monospace; font-size:24px; letter-spacing:2px; text-transform:uppercase; }
  .step.last { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .arr { color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:28px; }
  .chips-l { font-family:'JetBrains Mono',monospace; font-size:22px; letter-spacing:4px; color:var(--muted); text-transform:uppercase; margin-bottom:18px; }
  .page { background:var(--card); border:1px solid var(--line); border-radius:32px; overflow:hidden; position:relative; }
  .pg-h { display:flex; align-items:center; gap:12px; padding:18px 28px; border-bottom:1px solid var(--line); }
  .pg-h i { width:14px; height:14px; border-radius:50%; background:#2c2c31; }
  .pg-h span { font-family:'JetBrains Mono',monospace; font-size:21px; color:var(--muted); margin-left:12px; }
  .pg-b { display:flex; gap:36px; padding:26px 32px 32px; }
  .pg-img { width:250px; height:210px; flex:none; border-radius:22px; background:linear-gradient(135deg,#1b1b20,#26262d); display:flex; align-items:center; justify-content:center; color:#5c5c66; }
  .pg-info { flex:1; display:flex; flex-direction:column; gap:12px; justify-content:center; }
  .pg-line { height:16px; width:62%; border-radius:8px; background:#2a2a30; }
  .pg-price { font-family:'Syne',sans-serif; font-weight:800; font-size:34px; align-self:flex-start; padding:0 8px; margin-left:-8px; border-radius:12px; }
  .pg-stars { color:#E6B84C; font-size:25px; letter-spacing:2px; align-self:flex-start; padding:2px 8px; margin-left:-8px; border-radius:12px; }
  .pg-stars small { color:var(--muted); font-size:20px; letter-spacing:0; font-family:'Inter',sans-serif; }
  .pg-btn { position:relative; background:#2e2e35; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:24px; letter-spacing:2px; text-transform:uppercase; text-align:center; padding:18px 0; border-radius:100px; }
  .pg-note { color:var(--muted); font-size:21px; padding:2px 8px; margin-left:-8px; border-radius:10px; align-self:flex-start; }
  .pg-sticky { position:absolute; left:0; right:0; bottom:0; padding:22px 0; text-align:center; background:var(--accent); color:var(--bg); font-family:'JetBrains Mono',monospace; font-weight:500; font-size:26px; letter-spacing:3px; text-transform:uppercase; }
  .pg-chip { position:absolute; right:26px; top:12px; }
  .pg-b.st { padding-bottom:112px; }
  .chip { background:var(--accent); color:var(--bg); font-family:'JetBrains Mono',monospace; font-size:20px; letter-spacing:2px; text-transform:uppercase; padding:8px 18px; border-radius:100px; }
  .hl { outline:3px solid var(--accent); outline-offset:4px; box-shadow:0 0 40px rgba(116,192,255,.35); }
  .pg-btn.hl { background:var(--accent); color:var(--bg); outline-offset:5px; }
  .tap { position:absolute; right:38px; top:14px; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.85); box-shadow:0 0 0 10px rgba(255,255,255,.25); }
  .cmp { display:flex; align-items:stretch; gap:18px; }
  .cmp-card { flex:1; background:var(--card); border:1px solid var(--line); border-radius:30px; padding:30px; display:flex; flex-direction:column; gap:20px; justify-content:center; }
  .cmp-card.good { border-color:var(--accent); box-shadow:0 0 40px rgba(116,192,255,.18); }
  .cmp-l { font-family:'JetBrains Mono',monospace; font-size:22px; letter-spacing:4px; text-transform:uppercase; color:var(--muted); }
  .cmp-card.good .cmp-l { color:var(--accent); }
  .cmp-btn { background:#2e2e35; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:23px; letter-spacing:2px; text-transform:uppercase; text-align:center; padding:20px 12px; border-radius:100px; }
  .cmp-btn.good { background:var(--accent); color:var(--bg); }
  .cmp-t { font-size:29px; color:var(--text); line-height:1.35; }
  .cmp-mid { align-self:center; font-family:'JetBrains Mono',monospace; font-size:36px; color:var(--accent); }
  .bdgs { display:flex; gap:18px; }
  .bdg { flex:1; background:var(--card); border:1px solid var(--line); border-radius:30px; padding:34px 14px; display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center; }
  .bdg span { width:84px; height:84px; border-radius:50%; background:rgba(116,192,255,.12); color:var(--accent); display:flex; align-items:center; justify-content:center; }
  .bdg b { font-weight:500; font-size:26px; line-height:1.25; }
  .gal { display:flex; gap:16px; }
  .tile { flex:1; height:250px; border-radius:28px; border:1px solid var(--line); background:linear-gradient(160deg,#17171b,#222229); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; color:var(--accent); }
  .tile b { color:var(--text); font-weight:500; font-size:24px; }
  .spd { background:var(--card); border:1px solid var(--line); border-radius:32px; padding:32px 34px; display:flex; flex-direction:column; gap:26px; }
  .spd-title { font-family:'JetBrains Mono',monospace; font-size:22px; letter-spacing:4px; text-transform:uppercase; color:var(--muted); }
  .spd-r { display:flex; align-items:center; gap:22px; }
  .spd-l { width:230px; font-size:27px; flex:none; }
  .spd-t { flex:1; height:22px; border-radius:20px; background:#232329; overflow:hidden; }
  .spd-f { height:100%; width:22%; border-radius:20px; background:var(--accent); }
  .spd-f.slow { width:92%; background:#5b5b66; }
  .spd-x { width:90px; text-align:right; font-family:'JetBrains Mono',monospace; font-weight:500; font-size:24px; flex:none; }
  .tgs { display:flex; flex-direction:column; gap:14px; }
  .tg { display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--line); border-radius:26px; padding:20px 30px; font-size:30px; }
  .sw { width:76px; height:42px; border-radius:30px; background:#2e2e35; position:relative; flex:none; }
  .sw u { position:absolute; left:5px; top:5px; width:32px; height:32px; border-radius:50%; background:#8E8E95; }
  .sw.on { background:var(--accent); }
  .sw.on u { left:39px; background:#0A0A0C; }
  .pill { align-self:flex-start; margin-top:56px; padding:28px 52px; background:var(--accent); color:var(--bg); font-family:'JetBrains Mono',monospace; font-weight:500; font-size:30px; letter-spacing:3px; text-transform:uppercase; border-radius:100px; }
  .site { margin-top:34px; font-size:26px; letter-spacing:4px; color:var(--muted); }
  .bottom { display:flex; justify-content:space-between; align-items:center; min-height:40px; }
  .bars { display:flex; gap:10px; }
  .bar { width:44px; height:6px; border-radius:6px; background:var(--line); }
  .bar.on { background:var(--accent); }
  .swipe { font-size:26px; letter-spacing:4px; color:var(--muted); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="top">
      <div class="brand"><div class="logo">SF</div><span class="name">{{NAME}}</span></div>
      <span class="count">{{NUM}} / {{TOTAL}}</span>
    </div>
    <div class="main {{TYPE}}">
      <div class="label">{{LABEL}}</div>
      <h1>{{TITLE}}</h1>
      <p>{{BODY}}</p>
      {{VISUAL}}
      {{PILL}}
      {{SITE}}
    </div>
    <div class="bottom"><div class="bars">{{BARS}}</div><span class="swipe">{{SWIPE}}</span></div>
  </div>
</body>
</html>
