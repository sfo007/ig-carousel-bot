<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  {{FONTS}}
  :root { --bg:{{BG}}; --card:{{CARD}}; --line:{{LINE}}; --accent:{{ACCENT}}; --text:{{TEXT}}; --muted:{{MUTED}}; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1080px; height:1350px; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; overflow:hidden; position:relative; }
  .grid { position:absolute; inset:0; opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:90px 90px;
    -webkit-mask-image:radial-gradient(ellipse at 75% 15%,#000 0%,transparent 65%);
            mask-image:radial-gradient(ellipse at 75% 15%,#000 0%,transparent 65%); }
  .wrap { position:absolute; inset:0; padding:80px; display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .brand { display:flex; align-items:center; gap:22px; }
  .logo { width:76px; height:76px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:800; font-size:28px; letter-spacing:-1px; }
  .name, .count, .swipe, .label, .site { font-family:'JetBrains Mono',monospace; text-transform:uppercase; }
  .name { font-size:24px; letter-spacing:5px; color:var(--muted); }
  .count { font-size:26px; letter-spacing:3px; color:var(--muted); }
  .main { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .label { font-size:28px; letter-spacing:5px; color:var(--accent); margin-bottom:44px; }
  h1 { font-family:'Syne',sans-serif; font-weight:800; line-height:1.04; letter-spacing:-2px; color:var(--text); }
  h1 .dot { color:var(--accent); }
  p { color:var(--muted); line-height:1.45; }
  .cover h1 { font-size:92px; letter-spacing:-3px; }
  .cover p { font-size:42px; margin-top:48px; }
  .content h1 { font-size:68px; }
  .content p { margin-top:52px; background:var(--card); border:1px solid var(--line); border-radius:40px; padding:52px; font-size:40px; color:var(--text); opacity:.92; }
  .cta h1 { font-size:88px; letter-spacing:-3px; }
  .cta p { font-size:42px; margin-top:44px; }
  .pill { align-self:flex-start; margin-top:56px; padding:28px 52px; background:var(--accent); color:var(--bg); font-family:'JetBrains Mono',monospace; font-weight:500; font-size:30px; letter-spacing:3px; text-transform:uppercase; border-radius:100px; }
  .site { margin-top:34px; font-size:26px; letter-spacing:4px; color:var(--muted); }
  .bottom { display:flex; justify-content:space-between; align-items:center; min-height:40px; }
  .bars { display:flex; gap:10px; }
  .bar { width:44px; height:6px; border-radius:6px; background:var(--line); }
  .bar.on { background:var(--accent); }
  .swipe { font-size:26px; letter-spacing:4px; color:var(--muted); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="top">
      <div class="brand"><div class="logo">SF</div><span class="name">{{NAME}}</span></div>
      <span class="count">{{NUM}} / {{TOTAL}}</span>
    </div>
    <div class="main {{TYPE}}">
      <div class="label">{{LABEL}}</div>
      <h1>{{TITLE}}</h1>
      <p>{{BODY}}</p>
      {{PILL}}
      {{SITE}}
    </div>
    <div class="bottom"><div class="bars">{{BARS}}</div><span class="swipe">{{SWIPE}}</span></div>
  </div>
</body>
</html>
